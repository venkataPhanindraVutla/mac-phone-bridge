name: interop
on:
  push:
  pull_request:
jobs:
  interop:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cross-language interop test
        run: scripts/interop-test.sh
