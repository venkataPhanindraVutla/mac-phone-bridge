name: mac
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode (26 or later)
        # The pinned packages (swift-crypto 5, swift-protobuf 1.39) need Swift tools 6.2, so Xcode 16.x
        # cannot resolve them. Take the newest Xcode on the image and fail if none is 26+.
        run: |
          best=""
          bestmajor=0
          for app in /Applications/Xcode_*.app; do
            v="${app#/Applications/Xcode_}"; v="${v%.app}"
            major="${v%%.*}"
            case "$v" in ''|*[!0-9.]*) continue ;; esac # skips beta and release-candidate apps
            if [ "$major" -gt "$bestmajor" ] || { [ "$major" -eq "$bestmajor" ] && [ "$(printf '%s\n%s\n' "$best" "$app" | sort -V | tail -1)" = "$app" ]; }; then
              best="$app"; bestmajor="$major"
            fi
          done
          if [ -z "$best" ] || [ "$bestmajor" -lt 26 ]; then
            echo "No Xcode 26 or later found on this image" >&2
            ls -d /Applications/Xcode_*.app >&2 || true
            exit 1
          fi
          sudo xcode-select -s "$best"
          xcodebuild -version
          swift --version
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Install protoc 4.36.2
        run: |
          curl -fsSL -o protoc "https://repo1.maven.org/maven2/com/google/protobuf/protoc/4.36.2/protoc-4.36.2-osx-aarch_64.exe"
          echo "765ccb18be73e565bfc3e2ad94e85039ca28f928b3e62b487e51b7b8fdf1dcfb  protoc" | shasum -a 256 -c -
          chmod +x protoc
          mkdir -p "$HOME/.local/bin"
          mv protoc "$HOME/.local/bin/protoc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check generated protobuf sources
        run: scripts/gen-proto.sh --check
      - name: Check protocol vectors
        run: python3 -I protocol/tools/make_vectors.py --check
      - name: Build Swift tests
        run: swift build --build-tests --force-resolved-versions --package-path mac/Packages/AMKit
      - name: Swift tests (one test target per process)
        # Swift 6.3 links every test target into one bundle, and `swift test` would run all ~900
        # tests at once in one process, sharing one main actor on the runner's 3 vCPUs. Run each
        # target on its own instead, as Swift 6.4 does locally (one bundle per target); within a
        # target the tests still run in parallel. A hang fails the step in minutes, and the log
        # names the target that was running.
        timeout-minutes: 20
        run: |
          pkg=mac/Packages/AMKit
          targets="$(swift package --package-path "$pkg" dump-package | python3 -I -c '
          import json, sys
          print("\n".join(t["name"] for t in json.load(sys.stdin)["targets"] if t["type"] == "test"))')"
          if [ -z "$targets" ]; then echo "No test targets found in $pkg/Package.swift" >&2; exit 1; fi
          failed=""
          for target in $targets; do
            echo "== Running test target $target ($(date -u +%H:%M:%S) UTC)"
            if ! swift test --skip-build --force-resolved-versions --package-path "$pkg" --filter "^$target\."; then
              failed="$failed $target"
            fi
            echo "== Finished test target $target ($(date -u +%H:%M:%S) UTC)"
          done
          if [ -n "$failed" ]; then
            echo "Failed test targets:$failed" >&2
            exit 1
          fi
      - name: Generate Xcode project
        run: |
          xcodegen --spec mac/project.yml --project mac
          # The generated project has no Package.resolved of its own; AMKit's pins every
          # remote dependency, so give it to the workspace for -disableAutomaticPackageResolution.
          mkdir -p mac/AndroidMirroring.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp mac/Packages/AMKit/Package.resolved mac/AndroidMirroring.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/
      - name: Build app
        run: |
          xcodebuild -project mac/AndroidMirroring.xcodeproj -scheme AndroidMirroring \
            -destination 'platform=macOS' -disableAutomaticPackageResolution CODE_SIGN_IDENTITY=- build
