// Status channel: phone to Mac.
syntax = "proto3";

package anmirror.v1;

option java_package = "io.github.anmirror.protocol.v1";
option java_multiple_files = true;
option swift_prefix = "AM";

enum NetworkKind {
  NETWORK_KIND_UNSPECIFIED = 0;
  NETWORK_KIND_NONE = 1;
  NETWORK_KIND_WIFI = 2;
  NETWORK_KIND_CELLULAR = 3;
  NETWORK_KIND_OTHER = 4;
}

message StatusUpdate {
  int32 battery_percent = 1;
  bool charging = 2;
  int32 signal_level = 3;  // 0..4, or -1 for unknown / no service. Always set; proto3 omits 0 on the wire and it decodes as 0.
  NetworkKind network = 4;
}
